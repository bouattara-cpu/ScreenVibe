<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenVibe - Movies & Series Explorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <div class="header-content">
        <h1>🍿 ScreenVibe</h1>
        <p>Discover, search, and filter your favorite movies & series instantly!</p>
    </div>
    <div class="api-config">
        <input type="password" id="apiKeyInput" placeholder="Enter your OMDb API Key...">
        <button id="saveKeyBtn">Save Key</button>
    </div>
</header>
        <main>
            <!-- Search and Filter Section -->
            <section class="controls-section">
                <input type="text" id="searchInput" placeholder="Search for a movies (e.g., Spiderman, Avatar)...">
                <button id="searchBtn">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter">
                        <option value="">All</option>
                        <option value="movie">Movie</option>
                        <option value="series">Series</option>
                    </select>
                </div>

                <div class="filter-ground">
                    <label for="sortSelect">Sort By:</label>
                    <select id="sortSelect">
                        <option value="default">Relevance</option>
                        <option value="year-desc">Newest First</option>
                        <option value="year-asc">Oldest First</option>
                        <option value="title">Alphabetical (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!--Error Message Container -->
    <div id="errorMessage" class="hidden"></div>

    <!-- Movies Grid Container -->
    <section id="moviesContainer" class="movies-grid">
        <!-- Initial state message -->
         <p>✨ Type a movie name above or click search to start exploring!</p>
    </div>
</section>
</main>

    <!-- Movie Details Modal -->
     <div id="movieModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody">
                <!-- Dynamic details loaded here -->
            </div>
        </div>
    </div>

     <script src="app.js"></script>
</body>
</html>
